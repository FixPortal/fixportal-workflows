name: Review policy guard

# The review control plane must not be able to delete itself, and workflow changes must
# meet the hygiene bar mechanically rather than by a reviewer noticing.
#
# .claude/review-policy.json decides which reviewers a PR needs, and a repo with NO
# policy file tiers every PR NORMAL. So one .gitignore line re-excluding .claude/
# silently downgrades review for the whole repo — and the PR making that change would
# be the last one reviewed properly.
#
# That used to be guarded by tiering .gitignore HIGH in every repo, which works but
# bills a CodeRabbit review — metered per developer across the whole estate — for every
# trivial ignore edit, because the policy hook tiers by path glob and cannot tell
# "re-excludes .claude/" from "ignores a scratch directory".
#
# `.github/workflows/**` left the policy's high list on 2026-08-19 for the same reason,
# and is asserted here instead. Measured over 100 HIGH-tier PRs in the 30 days to that
# date: config-only diffs were 27 of them and produced FOUR actionable CodeRabbit
# comments between them, while code-bearing diffs produced 174. In the same sample 45 of
# 100 HIGH PRs got no CodeRabbit verdict at all — throttled out, CodeRabbit's own notice
# reporting 73 reviews in 7 days against a 30/7d threshold. So the glob was not buying
# review of workflow changes; it was crowding out review of code.
#
# What a reviewer was nominally catching on a workflow diff is checked below instead:
# unpinned actions, pull_request_target, and a blanket write-all token. actionlint covers
# syntax in the main CI workflow.
#
# THIS FILE DELETING ITSELF is covered by branch rules, not by review: "Review policy
# intact" is a REQUIRED status check across the estate, so removing this workflow means
# the check never reports and the PR cannot merge.
#
# That protection is OUT-OF-REPO state, admitted here because nothing in this repository
# asserts it: the ruleset that makes the check required lives in the repo's GitHub
# settings. Verified for this repo 2026-08-22 (`gh api repos/FixPortal/fixportal-workflows/
# rules/branches/main` -- the ruleset requires both "CI Gate" and "Review policy intact"),
# but a repo scaffolded with these workflows and WITHOUT the ruleset update runs both
# jobs green while nothing blocks merge. Wiring the ruleset is part of adopting them.
#
# Do not restore `.github/workflows/**` or `.gitignore` to the policy's high list without
# first removing the corresponding assertion here.

# Deliberately narrow: pull_request already covers branch commits.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: review-policy-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    # NAME IS LOAD-BEARING. "Review policy intact" is a required status check on main in
    # nearly every estate repo. Renaming the job silently detaches that requirement:
    # the rule waits for a context that no longer reports, and the old name never
    # arrives. Change the name only alongside a deliberate ruleset update everywhere.
    name: Review policy intact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Policy file must be tracked, unignored, and usable
        run: |
          set -euo pipefail
          policy=.claude/review-policy.json

          if ! git ls-files --error-unmatch "$policy" >/dev/null 2>&1; then
            echo "::error file=$policy::Review policy is untracked, so every PR in this repo would tier NORMAL. Restore and commit it."
            exit 1
          fi

          # --no-index is load-bearing: without it, check-ignore consults the index and
          # never reports a TRACKED file as ignored, so this would pass unconditionally
          # and guard nothing.
          if git check-ignore --no-index -q "$policy"; then
            echo "::error file=.gitignore::.gitignore now excludes $policy, which silently drops every PR in this repo to NORMAL. Restore the '!.claude/review-policy.json' negation."
            exit 1
          fi

          # Existence is not usability. An automated rollout once EMPTIED this file across
          # 21 repos; every repo then had no policy and tiered every PR NORMAL, and the
          # first version of this guard passed the whole time — an empty file is still
          # tracked and still unignored. Content is checked here for that reason.
          if [ ! -s "$policy" ]; then
            echo "::error file=$policy::Review policy is EMPTY, so every PR in this repo tiers NORMAL. Restore it from history."
            exit 1
          fi
          if ! jq -e . "$policy" >/dev/null 2>&1; then
            echo "::error file=$policy::Review policy is not valid JSON, so the tiering hook cannot read it and every PR falls back to NORMAL."
            exit 1
          fi
          if ! jq -e 'has("high") and (.high | type == "array")' "$policy" >/dev/null; then
            echo "::error file=$policy::Review policy has no 'high' array. Nothing can tier HIGH, so the policy is inert."
            exit 1
          fi
          # The review control plane must stay HIGH in every repo: this file decides which
          # reviewers a PR needs, and .coderabbit.yaml can silence a reviewer outright.
          #
          # This guard and its checker are on the list for a reason found on 2026-08-22.
          # The required "Review policy intact" context is produced by the PR's OWN copy of
          # this workflow, so a PR that replaces the assertion steps with `run: true` reports
          # the context green while asserting nothing. The header comment's self-protection
          # argument only ever covered DELETION -- a deleted workflow never reports, so the
          # context stays pending and blocks -- and said nothing about neutering.
          #
          # ci.yml and its checker are on the list for the same reason: "CI Gate" is the
          # other required context, and it too runs the PR's own copy -- a PR that keeps the
          # job name and drops `needs:` from ci-gate merges green under the lighter review.
          for required in .claude/review-policy.json .coderabbit.yaml \
            .github/workflows/review-policy-guard.yml .github/scripts/assert_workflow_hygiene.py \
            .github/workflows/ci.yml .github/scripts/assert_gate_coverage.py; do
            if ! jq -e --arg r "$required" '.high | index($r)' "$policy" >/dev/null; then
              echo "::error file=$policy::'$required' is missing from the high list. An edit to it would get the lighter review."
              exit 1
            fi
          done

          echo "Review policy is tracked, unignored, parseable, and tiers its own control plane HIGH."
          jq -c '{version, high: (.high | length), low: (.low | length)}' "$policy"

      # Structural parse, NOT a grep. The three line-anchored greps this replaces were
      # bypassable by ORDINARY block-style YAML -- a value may sit on the line after its
      # key -- so `permissions:` followed by an indented `write-all`, and a `uses:` split
      # the same way, both passed the guard green while resolving to exactly what the
      # single-line spelling resolves to. Observed 2026-08-22; the script header carries
      # the evidence. Parsing also removes the self-match hazard that forced the old
      # `^[^#]*` prefixes: a parser reads values, so a comment describing a rule -- such
      # as this one -- cannot be mistaken for a violation of it.
      # Deliberately NO actions/setup-python step. That installs a clean interpreter from
      # the tool cache, and PyYAML is not in it -- which failed this job on its first run
      # (2026-08-22, "PyYAML is not available to this runner"). The runner image's SYSTEM
      # python3 does carry PyYAML, which is what the sibling assert_gate_coverage.py has
      # been relying on. Adding setup-python here shadows the interpreter that works.
      - name: Workflows must be hygienic (no target-context trigger, no write-all, actions pinned)
        run: python3 .github/scripts/assert_workflow_hygiene.py
