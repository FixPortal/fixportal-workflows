reviews:
  profile: assertive
  poem: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  request_changes_workflow: true

  auto_review:
    # OFF deliberately. The PR gate in .claude/review-policy.json decides which reviewers a PR
    # needs, and CodeRabbit is reserved for HIGH-tier changes. It meters reviews per DEVELOPER
    # IDENTITY across every repo in a rolling 7-day window, degrading from 30/7d, so it is the
    # scarce reviewer and must be spent deliberately. Leaving automatic review on reviews every
    # PR regardless of tier, which makes the tier evaluation pointless. HIGH-tier PRs get an
    # on-demand "@coderabbitai review", which still works with automatic review disabled.
    #
    # auto_pause_after_reviewed_commits is deliberately absent: it governs AUTOMATIC re-review
    # only, so with automatic review off it would be dead config that reads as load-bearing.
    enabled: false
    drafts: false
    # REVERSED 2026-07-29. This block previously said "do NOT ignore dependabot[bot]", on the
    # grounds that dependency changes were classed HIGH and Gitar skipped bot authors, so
    # silencing CodeRabbit too would leave them unreviewed. Zero AI review of dependency bumps is
    # now the intended state: the estate raises enough of them that reviewing each one exhausts
    # the allowance and starves the changes that need it. Gitar's bot review is switched off as
    # well, and dependency manifests are no longer classed HIGH in the review policy. CI plus
    # Dependabot's own advisory data is what gates a bump.
    ignore_usernames:
      - "dependabot[bot]"
      - "renovate[bot]"

  instructions: |
    Review as a senior engineer. Prioritise correctness and security.

    This repo's PRODUCT is its reusable GitHub Actions workflows: other repositories
    call them by ref. A change here is a RELEASE to every consumer, not this repo's own
    CI. Review it as a public interface change — call out anything that alters inputs,
    outputs, secrets handling, or default behaviour for existing callers.

    Pay particular attention to:
    - overly broad `permissions:` (least privilege per job)
    - untrusted input reaching `run:` blocks (script injection via ${{ }})
    - third-party actions not pinned to a full commit SHA
    - secrets exposure through logs, env, or `persist-credentials`
    - concurrency settings that could cancel an in-flight deploy in a consuming repo
