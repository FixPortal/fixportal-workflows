name: Representative coverage caller

on:
  workflow_dispatch:

jobs:
  coverage:
    uses: ./.github/workflows/dotnet-coverage.yml
    with:
      solution: FixPortal.Example.slnx
      dotnet-version: 10.0.x
      configuration: Release
      runs-on: ubuntu-latest
      test-filter: Category!=Integration
      assembly-filters: +FixPortal.Example.*;-*.Tests
      dotnet-coverage-version: 18.9.0
      artifact-name: representative-coverage
    secrets: inherit
